services:
  db:
    image: postgres:13.3
    environment:
      - POSTGRES_DB=some_shop
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - PGUSER=postgres
    # Throwaway test data: keep it in RAM and drop the durability guarantees.
    tmpfs:
      - /var/lib/postgresql/data
    command: >
      postgres
      -c fsync=off
      -c full_page_writes=off
      -c synchronous_commit=off
    ports:
      # Override when the default port is taken: POSTGRES_PORT=55432 task run-env
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 2s
      timeout: 3s
      retries: 20

  # KRaft single-node broker, no ZooKeeper. The native (GraalVM) build starts in
  # about a second and, unlike the JVM image, runs on aarch64 hosts.
  kafka:
    image: apache/kafka-native:3.8.1
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=INTERNAL://0.0.0.0:29091,EXTERNAL://0.0.0.0:9091,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:29091,EXTERNAL://${DOCKER_HOST_IP:-127.0.0.1}:${KAFKA_PORT:-9091}
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LOG_DIRS=/tmp/kraft-combined-logs
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_NUM_PARTITIONS=1
      - KAFKA_DEFAULT_REPLICATION_FACTOR=1
      - KAFKA_DELETE_TOPIC_ENABLE=true
      # Default is 3s of dead time before the first consumer group rebalance.
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_LOG_RETENTION_HOURS=1
    ports:
      - "${KAFKA_PORT:-9091}:9091"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 29091 || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 20

  # The native broker image ships no CLI tools, so topics are created by a small
  # .NET tool that reads the names straight from the contracts.
  init-kafka:
    build:
      context: ../
      dockerfile: ./Dockerfile
      target: kafka-init
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29091
    depends_on:
      kafka:
        condition: service_healthy
